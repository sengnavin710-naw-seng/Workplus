[package]
name = "workforce-platform-agent"
version = "0.0.0"
description = "Visible workforce platform desktop agent"
authors = ["Workforce Platform"]
edition = "2021"

[lib]
name = "workforce_platform_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
open = "5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
