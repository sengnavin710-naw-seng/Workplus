services:
  - type: web
    name: workplus-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: bun install --frozen-lockfile && bun --filter @repo/web build
    startCommand: bun --filter @repo/web start
    healthCheckPath: /api/health
    envVars:
      - key: BUN_VERSION
        value: 1.3.14
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://app.workplus.store
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.workplus.store
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        value: WorkPlus <invites@mail.workplus.store>
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: INVITATION_OUTBOX_SECRET
        sync: false
